[project]
name = "cybersierra-deepagents-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.13",
    "langchain-openai>=1.6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness", "server"]
